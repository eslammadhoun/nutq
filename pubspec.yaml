name: nutq
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.1.0
  flutter_screenutil_plus: ^1.6.0
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  flutter_gemma: ^1.8.3
  flutter_gemma_litertlm: ^1.7.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  freezed: ^3.2.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/svgs/
    - assets/models/gemma3-1b-it-q4.litertlm
  fonts:
    # Latin UI font — Inter (static instances, text optical size)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

    # Arabic content font — used as fallback via AppTypography.fontFamilyFallback
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
