name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # pubspec.yaml bundles the on-device model as an asset, but the ~584 MB file
      # is not in git and no test loads it. An empty placeholder keeps the asset
      # bundle valid for analyze and test.
      - name: Create placeholder model asset
        run: |
          mkdir -p assets/models
          : > assets/models/gemma3-1b-it-q4.litertlm

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
